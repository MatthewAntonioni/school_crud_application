<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fines</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #999;
            padding: 6px 10px;
            text-align: left;
        }

        th {
            background: #eee;
        }

        .money {
            text-align: right;
        }

        #pay {
            margin-top: 15px;
            padding: 8px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .error {
            color: #b00;
        }
    </style>
</head>
<body>

<h1>payment page</h1>

<p><a href="../index.html">Back to home</a></p>

<!-- error messages -->
<p id="message"></p>

<!-- fines are put in here by payment.js -->
<table id="fines" hidden>
    <thead>
    <tr>
        <th>Book</th>
        <th>Days late</th>
        <th>Date</th>
        <th class="money">Amount</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<h2 id="total"></h2>

<!-- only shows if a member owes something -->
<button id="pay" hidden>Pay now</button>

<script src="payment.js"></script>

</body>
</html>
